name: Android APK

# Builds an installable debug APK of the game on every push. Download it from
# the run's "Artifacts" section (Actions tab). Builds of the default branch are
# also published as the "Android test build" release, at a fixed address:
# https://github.com/<owner>/<repository>/releases/download/android-latest/cup-catcher-debug.apk
on:
  push:
    paths-ignore: ['**.md', 'career-simulator/**', '.github/workflows/career-simulator.yml']
  workflow_dispatch:

permissions:
  # Write access only to publish the APK as a release asset.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public Firebase web settings, set under Settings → Secrets and variables →
      # Actions → Variables. Without them the app plays single player and says
      # online features await configuration.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the game and copy it into the Android project
        run: npm run android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/cup-catcher-${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cup-catcher-android-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish as the "Android test build" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk out/cup-catcher-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/cup-catcher-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build" \
            --notes "Debug build of ${GITHUB_SHA::7} (run ${{ github.run_number }}). To install, allow your browser or file manager to install unknown apps."
