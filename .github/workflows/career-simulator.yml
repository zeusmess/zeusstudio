name: Career Simulator APK

# Builds the Starbucks Career Simulator app (career-simulator/) whenever it changes. Download
# the APK from the run's "Artifacts" section (Actions tab). Builds of the default branch are
# also published as the "Career Simulator" release, at a fixed address:
# https://github.com/<owner>/<repository>/releases/download/career-simulator-latest/starbucks-career.apk
on:
  push:
    paths:
      - 'career-simulator/**'
      - '!career-simulator/**/*.md'
      - '.github/workflows/career-simulator.yml'
  workflow_dispatch:

permissions:
  # Write access only to publish the APK as a release asset.
  contents: write

concurrency:
  group: career-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the APK
        working-directory: career-simulator/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --verbose career-simulator/android/app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: |
          mkdir -p out
          cp career-simulator/android/app/build/outputs/apk/release/app-release.apk "out/starbucks-career-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: starbucks-career-android-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish as the "Career Simulator" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk out/starbucks-career.apk
          gh release delete career-simulator-latest --yes --cleanup-tag || true
          gh release create career-simulator-latest out/starbucks-career.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Career Simulator" \
            --notes "Build of ${GITHUB_SHA::7} (run ${{ github.run_number }}). To install, allow your browser or file manager to install unknown apps."
