name: Web (GitHub Pages)

# Publishes the web version to https://<owner>.github.io/<repository>/ and
# Starbucks Career to https://<owner>.github.io/<repository>/career/.
# Inert until GitHub Pages is turned on (Settings → Pages → Source: GitHub Actions).
# Then run it from the Actions tab, or set the repository variable PAGES_ENABLED=true
# to publish on every push to the default branch.
on:
  push:
    paths-ignore: ['**.md', 'android/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.PAGES_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Starbucks Career is published next to the game at /<repository>/career/
      # with the Firebase settings of its own project.
      - name: Build Starbucks Career into /career/
        working-directory: career
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.CAREER_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.CAREER_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.CAREER_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.CAREER_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.CAREER_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build
          rm -rf ../dist/career
          cp -r dist ../dist/career

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
